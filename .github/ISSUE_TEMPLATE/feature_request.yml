name: Feature request
description: Suggest an improvement or a new feature
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like Unravel to do?
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Could it delete or change anything?
      description: If so, how should the user preview and undo it?
